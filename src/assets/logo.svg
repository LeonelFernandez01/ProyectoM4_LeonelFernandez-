<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradiente de fondo del logo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    
    <!-- Gradiente del checkmark -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Sombra suave para efecto de elevación -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fondo: Cuadrado redondeado (Squircle) con gradiente premium -->
  <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#bgGrad)" filter="url(#glow)" />

  <!-- Círculo interior decorativo semi-transparente -->
  <circle cx="256" cy="256" r="160" stroke="rgba(255, 255, 255, 0.15)" stroke-width="12" stroke-dasharray="24 16" />

  <!-- Checkmark estilizado en 3D / Gradiente -->
  <path d="M160 260 L224 324 L352 196" 
        stroke="url(#checkGrad)" 
        stroke-width="48" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.15))" />
</svg>
